[project]
name = "engineer-logbook"
version = "0.1.0"
description = "MCP server for a personal engineering logbook on Postgres: sessions, logs, notes, paths, tasks, decisions, snippets."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.9,<2",
    "psycopg[binary,pool]>=3.2,<4",
    "textual>=8.2.8",
]

[project.scripts]
engineer-logbook = "engineer_logbook.server:main"
engineer-logbook-ui = "engineer_logbook.ui:main"
engineer-logbook-pg-admin = "engineer_logbook.pg_admin:main"
engineer-logbook-migrate = "engineer_logbook.migrate:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engineer_logbook"]
